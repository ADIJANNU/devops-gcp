version: 2
updates:
  - package-ecosystem: pip
    directory: /app/api-service
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /app/ingestion
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /app/api-service
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /app/dashboard
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /app/ingestion
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
