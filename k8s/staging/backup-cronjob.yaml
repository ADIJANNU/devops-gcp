apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  annotations:
    iam.gke.io/gcp-service-account: fleetpulse-backup@devops-learning-505512.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleetpulse-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: backup
          volumes:
            - name: backup
              emptyDir: {}
          initContainers:
            - name: dump
              image: postgres:16
              command: ["sh", "-c", "pg_dump -Fc -f /backup/db.dump && ls -l /backup"]
              envFrom:
                - secretRef:
                    name: backup-db-credentials
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
          containers:
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
              command:
                - sh
                - -c
                - gcloud storage cp /backup/db.dump gs://devops-learning-505512-fleetpulse-staging-backups/staging/fleetpulse-`date -u +%Y%m%dT%H%M%SZ`.dump
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 512Mi
