apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetpulse-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleetpulse-dashboard
  template:
    metadata:
      labels:
        app: fleetpulse-dashboard
    spec:
      containers:
        - name: dashboard
          image: asia-south1-docker.pkg.dev/devops-learning-505512/fleetpulse-staging-images/dashboard:v1
          ports:
            - containerPort: 8080
