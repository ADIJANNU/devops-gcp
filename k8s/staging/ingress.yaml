apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetpulse
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "fleetpulse-staging-ip"
    networking.gke.io/managed-certificates: "fleetpulse-cert"
    networking.gke.io/v1beta1.FrontendConfig: "fleetpulse-frontend"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fleetpulse-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleetpulse-dashboard
                port:
                  number: 8080
